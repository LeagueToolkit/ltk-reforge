[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
reforge = { path = "crates/reforge" }
reforge-census = { path = "crates/reforge-census" }
reforge-wwise = { path = "crates/reforge-wwise" }
reforge-magic = { path = "crates/reforge-magic" }
reforge-testkit = { path = "crates/reforge-testkit" }

# LeagueToolkit crates: every League format goes through these and nothing else.
ltk_hash = "0.4"
ltk_primitives = "0.3"
ltk_io_ext = "0.4.4"
ltk_file = "0.2.11"
ltk_wad = "0.5.4"
ltk_meta = "0.8.6"
ltk_mesh = "0.4.6"
ltk_anim = "0.3.7"
# The shader cache's tables of contents. 0.3.10 has the same source and needs an ltk_io_ext newer
# than the commit patched in below.
ltk_shader = "=0.3.8"
# Later milestones, declared now so the versions agree from the start.
ltk_ritobin = "0.9.0"
ltk_texture = "0.6.1"
ltk_game_data = "0.7.2"
ltk_mod_project = "0.15.2"
ltk_modpkg = "0.12.5"
ltk_hashtable = "0.1.3"
ltk_overlay = "0.14.2"

# Mimir: the League Toolkit hash cache (`%LOCALAPPDATA%\LeagueToolkit\hashes`), read, and updated
# by the app with Mimir's own updater (#ADR-0059), at the revision LTK Manager checks out.
ltk_hashdb = { git = "https://github.com/LeagueToolkit/mimir", rev = "670196996ae219cbae5e64d40667363ff19a028f" }
ltk_mimir_cache = { git = "https://github.com/LeagueToolkit/mimir", rev = "670196996ae219cbae5e64d40667363ff19a028f" }

# Deflate and stored only: fewer decoders for untrusted archives to reach.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# The bytes a blob store hands out (#ADR-0093): shared on clone, sliced without a copy.
byteview = "0.10"
# A shader variant's key, which keeps the defines' case: ltk_hash's xxh64 lowercases.
xxhash-rust = { version = "0.8", features = ["xxh64"] }
rusqlite = { version = "0.40", features = ["bundled"] }
gix = { version = "0.88", default-features = false, features = ["max-performance-safe", "sha1"] }
clap = { version = "4", features = ["derive", "env"] }
# The command's interrupt, which cancels a run between two steps (#ADR-0097).
ctrlc = "3.5.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
# The version every league-toolkit crate builds against.
glam = "0.27"
rayon = "1"
# DDS is Microsoft's container, read for its blocks when a texture ships in TEX's; the version ltk_texture reads with.
ddsfile = "0.5.2"
# A mod's image, decoded and written again as the package's thumbnail (#ADR-0051). The three
# formats league-mod's own import reads, and no other decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Scratch directories and repositories in tests.
tempfile = "3"

# Every filesystem call: its errors name the path (clippy.toml forbids `std::fs`).
fs-err = "3"
# Filesystem paths as UTF-8. Paths inside the history are strings, not these.
camino = "1"
# A span per build, WAD and entry, so a failure in a scheduled run's log names where it happened.
# The ltk crates log through `log`, which the subscriber takes in too.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# The checks before a push: every changed YAML file loaded and validated against the schema the
# tree's census.yaml names for it, the schemas' patterns as regexes.
serde_yaml_ng = "0.10"
regex = "1"
# A rendered file against the history's blob, as a line diff when they differ.
pretty_assertions = "1"

# The app, on LTK Manager's stack (#ADR-0046). The three specta crates move together, at the
# versions LTK Manager pins.
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
# How LTK Manager finds the game install on a machine.
ltk_mod_core = "0.1.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# The prebuilt history index, the hash tables and the schema database fetched from where they
# are published (#ADR-0047, #ADR-0059): the HTTP client LTK Manager uses, and the decoder of the
# `.zst` the index is published as, the zstd the ltk crates link already. The index's object
# bytes are zstd frames, with dictionaries trained by it (#ADR-0078).
reqwest = { version = "0.12", features = ["blocking"] }
zstd = "0.13"
# The census history's archive read as a stream, its pack's files taken (#ADR-0060).
tar = "0.4"
parking_lot = "0.12"
# A package's thumbnail sent to the window as a `data:` URL.
base64 = "0.22"

# ltk_ritobin as census-sync reads and writes the census history's bin entries,
# LeagueToolkit/league-toolkit#269 at 521a875, until it is released: the release before it reads
# 2.3% of the entries at 16.19.8207193 wrong (exponent floats in an `mtx44`, a null pointer before
# a field). The crates its types are made of come from the same commit, so the build holds one
# ltk_meta and one ltk_hash.
[patch.crates-io]
ltk_ritobin = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "521a875e7c281da1ef98fad93dd822ae8b68f430" }
ltk_meta = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "521a875e7c281da1ef98fad93dd822ae8b68f430" }
ltk_hash = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "521a875e7c281da1ef98fad93dd822ae8b68f430" }
ltk_primitives = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "521a875e7c281da1ef98fad93dd822ae8b68f430" }
ltk_io_ext = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "521a875e7c281da1ef98fad93dd822ae8b68f430" }
# LeagueToolkit/league-mod#302 at 1fbf4c8, until it is released: the release before it orders the
# chunks of one WAD and layer as a HashMap gives them, so two writes of one package differ. Every
# league-mod crate the workspace uses comes from the same commit, so the build holds one of each.
ltk_modpkg = { git = "https://github.com/LeagueToolkit/league-mod", rev = "1fbf4c8b0cf4e44098f39b41278d7f57da2fa83a" }
ltk_mod_project = { git = "https://github.com/LeagueToolkit/league-mod", rev = "1fbf4c8b0cf4e44098f39b41278d7f57da2fa83a" }
ltk_hashtable = { git = "https://github.com/LeagueToolkit/league-mod", rev = "1fbf4c8b0cf4e44098f39b41278d7f57da2fa83a" }
ltk_game_data = { git = "https://github.com/LeagueToolkit/league-mod", rev = "1fbf4c8b0cf4e44098f39b41278d7f57da2fa83a" }
ltk_mod_core = { git = "https://github.com/LeagueToolkit/league-mod", rev = "1fbf4c8b0cf4e44098f39b41278d7f57da2fa83a" }

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = true

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "allow", priority = -1 }
