# The tools of the checks and of the Windows build on Linux, and the tasks that run them
# (#ADR-0053). scripts/README.md, "cross", has the system packages they need.

[tools]
# The version rust-toolchain.toml pins, written the same: rustup holds `1.99` and `1.99.0` as
# two toolchains, and a build that uses both finds its Windows target on the other one.
rust = { version = "1.99.0", components = "clippy,rustfmt" }
node = "24"
# The version app/package.json pins: a later pnpm refuses to stand in for it.
pnpm = "11.13.0"
"github:rust-cross/cargo-xwin" = "0.23.1"

[tasks.check]
description = "The checks: format, lints, tests, and the front end's"
# The `check` job of .github/workflows/build.yml runs the same commands, a step each.
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "pnpm --dir app install --frozen-lockfile",
  "pnpm --dir app check",
]

[tasks.build-windows]
description = "The command, the app and its installer for x86_64-pc-windows-msvc"
run = "bash scripts/cross/build-windows.sh"
