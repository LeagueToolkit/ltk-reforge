# The checks, and a build of what a release holds: the command, the app and its installer for
# Windows, cross-compiled on Linux (#ADR-0053).
#
# Runs on a pull request and on a push to master. release.yml calls it for the files it
# publishes, so a release waits for the checks too.
#
# Both jobs run the tasks of mise.toml, in the Ubuntu the tasks were tried on.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a call from release.yml the workflow's name is the caller's, so the two do not share a group.
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 60
    env:
      # Without these the build output is 25 GB, more than a runner's free disk. With them it
      # is 3.5 GB (2026-10-04).
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the system packages
        run: bash scripts/cross/setup-ubuntu.sh

      # The tools mise.toml lists, the Rust toolchain among them.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Run the checks
        run: mise run check

  windows:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the system packages
        run: bash scripts/cross/setup-ubuntu.sh

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      # Microsoft's CRT and SDK, which cargo-xwin fetches on a first run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ hashFiles('mise.toml') }}

      - name: Build the command, the app and its installer
        run: mise run build-windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/reforge.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
