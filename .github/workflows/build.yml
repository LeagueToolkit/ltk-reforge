# The checks, and a build of what a release holds: the command, the app and its installer for
# Windows, cross-compiled on Linux (#ADR-0053).
#
# Runs on a pull request and on a push to master. release.yml calls it for the files it
# publishes, so a release waits for the checks too.
#
# Both jobs run the commands of mise.toml's tasks, a step each, in the Ubuntu they were tried on.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a call from release.yml the workflow's name is the caller's, so the two do not share a group.
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 60
    env:
      # Without these the build output is 25 GB, more than a runner's free disk. With them it
      # is 3.5 GB (2026-10-04).
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the system packages
        run: bash scripts/cross/setup-ubuntu.sh

      # rustup and its toolchain, which mise installs outside the directory mise-action caches.
      # With them in place mise downloads neither.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-check-${{ hashFiles('rust-toolchain.toml') }}

      # The tools mise.toml lists, the Rust toolchain among them.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Check the format
        run: cargo fmt --all --check

      - name: Run the lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked

      - name: Install the front end's dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Check the front end
        run: pnpm --dir app check

  windows:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the system packages
        run: bash scripts/cross/setup-ubuntu.sh

      # As in the job above, with the Windows target's standard library too.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-windows-${{ hashFiles('rust-toolchain.toml') }}

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      # Microsoft's CRT and SDK, which cargo-xwin fetches on a first run: 15 minutes on a runner
      # (2026-10-04). The key is raised by hand, to fetch them again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-1
          restore-keys: cargo-xwin-

      # Each step below sources this again, for the variables: a step keeps none of the last one's.
      - name: Fetch the Windows target, CRT and SDK
        run: . scripts/cross/env.sh

      # First, and `--locked`: a Cargo.lock that does not match Cargo.toml stops the build here.
      - name: Build the command
        run: |
          . scripts/cross/env.sh
          cargo build --release --locked -p reforge-cli --target x86_64-pc-windows-msvc

      - name: Install the front end's dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Build the app and its installer
        run: |
          . scripts/cross/env.sh
          pnpm --dir app tauri build --ci --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/reforge.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
