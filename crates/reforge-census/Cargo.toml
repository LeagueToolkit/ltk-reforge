[package]
name = "reforge-census"
description = "The census history read with gix: the walk that folds every build into one life per key, and the writer of the history index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The history fetched from its server as far as an append reads it, over HTTPS (#ADR-0057).
fetch = ["gix/blocking-http-transport-reqwest-native-tls"]

[dependencies]
reforge.workspace = true
reforge-wwise.workspace = true
ltk_meta.workspace = true
ltk_ritobin.workspace = true
indexmap.workspace = true
gix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
rayon.workspace = true
rusqlite.workspace = true
zstd.workspace = true
tar.workspace = true
memmap2.workspace = true
fs-err.workspace = true
camino.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
